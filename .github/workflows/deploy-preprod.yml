name: Build y push a GHCR

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build y push a GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nombre de imagen en minusculas (GHCR lo exige)
        id: meta
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build y push de la imagen (con parches)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/mayan-edms-preprod:latest
            ghcr.io/${{ steps.meta.outputs.owner }}/mayan-edms-preprod:${{ github.sha }}
