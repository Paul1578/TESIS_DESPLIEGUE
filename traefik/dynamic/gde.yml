# Configuracion dinamica: routers, middlewares y servicios
# Backend: nginx del stack Mayan de este repo (traefik/dynamic) que publica
# MAYAN_HTTP_PORT=1987 en el host. Se alcanza por el gateway de Docker
# (172.17.0.1) porque Traefik corre en la misma maquina que la app.

http:
  middlewares:
    redirect-to-https:
      redirectScheme:
        scheme: https
        permanent: true

    security-headers:
      headers:
        frameDeny: true
        sslRedirect: true
        browserXssFilter: true
        contentTypeNosniff: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 31536000
        customFrameOptionsValue: "SAMEORIGIN"

  routers:
    herramientagde-http:
      rule: "Host(`herramientagde.byronrm.com`)"
      entryPoints:
        - web
      middlewares:
        - redirect-to-https
      priority: 10

    herramientagde:
      rule: "Host(`herramientagde.byronrm.com`)"
      entryPoints:
        - websecure
      middlewares:
        - security-headers
      service: herramientagde-svc
      tls:
        certResolver: letsencrypt

  services:
    herramientagde-svc:
      loadBalancer:
        servers:
          - url: "http://172.17.0.1:1987"
