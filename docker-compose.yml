x-mayan-container: &mayan-container
  image: ${MAYAN_IMAGE:-ghcr.io/paul1578/mayan-edms-preprod:latest}
  build:
    context: .
    dockerfile: Dockerfile
  env_file: .env
  environment:
    MAYAN_SECRET_KEY: "${MAYAN_SECRET_KEY:?DEFINE MAYAN_SECRET_KEY en .env}"
    MAYAN_CELERY_BROKER_URL: redis://:${MAYAN_REDIS_PASSWORD:-mayanredispassword}@redis:6379/0
    MAYAN_CELERY_RESULT_BACKEND: redis://:${MAYAN_REDIS_PASSWORD:-mayanredispassword}@redis:6379/1
    MAYAN_LOCK_MANAGER_BACKEND: mayan.apps.lock_manager.backends.redis_lock.RedisLock
    MAYAN_LOCK_MANAGER_BACKEND_ARGUMENTS: "{'redis_url':'redis://:${MAYAN_REDIS_PASSWORD:-mayanredispassword}@redis:6379/2'}"
    MAYAN_DATABASES: "{'default':{'ENGINE':'django.db.backends.postgresql','NAME':'${MAYAN_DATABASE_NAME:-mayan}','PASSWORD':'${MAYAN_DATABASE_PASSWORD:-mayandbpass}','USER':'${MAYAN_DATABASE_USER:-mayan}','HOST':'${MAYAN_DATABASE_HOST:-postgresql}'}}"
    MAYAN_DEFAULT_FROM_EMAIL: ${MAYAN_DEFAULT_FROM_EMAIL:-mayan@localhost}
    MAYAN_EMAIL_BACKEND: ${MAYAN_EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
    MAYAN_EMAIL_HOST: ${MAYAN_EMAIL_HOST:-mailpit}
    MAYAN_EMAIL_HOST_PASSWORD: ${MAYAN_EMAIL_HOST_PASSWORD:-}
    MAYAN_EMAIL_HOST_USER: ${MAYAN_EMAIL_HOST_USER:-}
    MAYAN_EMAIL_PORT: ${MAYAN_EMAIL_PORT:-1025}
    MAYAN_EMAIL_USE_TLS: ${MAYAN_EMAIL_USE_TLS:-false}
    MAYAN_LANGUAGE_CODE: ${MAYAN_LANGUAGE_CODE:-es}
    MAYAN_TIME_ZONE: ${MAYAN_TIME_ZONE:-America/Guayaquil}
    MAYAN_DOCKER_WAIT: ${MAYAN_DOCKER_WAIT:-postgresql:5432 redis:6379 mailpit:1025}
    MAYAN_APT_INSTALLS: ${MAYAN_APT_INSTALLS:-tesseract-ocr-spa}
    MAYAN_OCR_LANGUAGE: ${MAYAN_OCR_LANGUAGE:-spa}
  healthcheck:
    test: ["CMD-SHELL", "/opt/mayan-edms/bin/python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=5)\""]
    interval: 30s
    timeout: 10s
    retries: 5
    start_period: 120s
  networks:
    - mayan
  restart: unless-stopped
  volumes:
    - app_data:/var/lib/mayan
    - ${WATCH_FOLDER:-/mnt/escaner}:/var/lib/mayan/watch_folder

networks:
  mayan:
    driver: bridge

services:
  app:
    <<: *mayan-container
    depends_on:
      - postgresql
      - redis
      - mailpit

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${MAYAN_HTTP_PORT:-80}:80"
    networks:
      - mayan
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  seed:
    <<: *mayan-container
    restart: "no"
    healthcheck:
      disable: true
    entrypoint: ["/bin/bash", "/scripts/seed_entrypoint.sh"]
    volumes:
      - app_data:/var/lib/mayan
      - ./scripts/seed_taxonomy.py:/scripts/seed_taxonomy.py:ro
      - ./scripts/seed_entrypoint.sh:/scripts/seed_entrypoint.sh:ro
    depends_on:
      app:
        condition: service_healthy

  postgresql:
    image: postgres:16
    environment:
      POSTGRES_DB: ${MAYAN_DATABASE_NAME:-mayan}
      POSTGRES_PASSWORD: ${MAYAN_DATABASE_PASSWORD:-mayandbpass}
      POSTGRES_USER: ${MAYAN_DATABASE_USER:-mayan}
    networks:
      - mayan
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    command:
      - redis-server
      - --appendonly
      - "no"
      - --databases
      - "3"
      - --maxmemory
      - "100mb"
      - --maxclients
      - "500"
      - --maxmemory-policy
      - "allkeys-lru"
      - --save
      - ""
      - --requirepass
      - "${MAYAN_REDIS_PASSWORD:-mayanredispassword}"
    image: redis:7-alpine
    networks:
      - mayan
    restart: unless-stopped
    volumes:
      - redis_data:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
    networks:
      - mayan
    restart: unless-stopped

volumes:
  app_data:
  postgres_data:
  redis_data:
