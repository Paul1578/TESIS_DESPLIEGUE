# Reverse proxy hacia Mayan EDMS (app:8000)
server {
    listen 80;
    server_name _;

    # Permite subir documentos pesados (default de nginx: 1 MB).
    client_max_body_size 500M;

    # Resolucion en runtime (no al arrancar): nginx levanta aunque la app
    # tarde en estar disponible (tipico en el primer boot / Swarm).
    resolver 127.0.0.11 valid=10s;
    set $mayan_backend http://app:8000;

    location / {
        proxy_pass $mayan_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Conserva el esquema original (https via tunnel, http en LAN).
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}
