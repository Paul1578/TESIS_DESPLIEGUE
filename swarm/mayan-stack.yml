# Despliegue en Swarm para hosts que YA tienen un Traefik Swarm en 80/443
# (ej. el servidor Contabo 161.97.140.245). El Traefik del host es v2.7,
# providers.docker swarmMode, ruteo por labels.
#
# Es la ALTERNATIVA al stack compose principal (docker-compose.yml, con Traefik
# integrado) para cuando el host ya ocupa 80/443 con su propio Traefik.
#
# El Traefik del host rutea por labels:
#   ${MAYAN_DOMAIN} -> nginx (red traefik-public, puerto interno 80)
# y emite el certificado con el resolver `http` (httpChallenge en :80).
#
# Requisitos en el host (ver swarm/README.md):
#   1. Red overlay `traefik-public` existente.
#   2. Corregir el typo del traefik.yml del host: traefik-pubic -> traefik-public.
#   3. Carpeta /mnt/escaner creada en el host.
#   4. `.env` en la raiz del repo con MAYAN_SECRET_KEY, MAYAN_AUTOADMIN_PASSWORD
#      y MAYAN_CSRF_TRUSTED_ORIGINS incluyendo https://${MAYAN_DOMAIN}.
#
# Desplegar:
#   cd ~/mayan-docker
#   set -a; source .env; set +a
#   docker stack deploy -c swarm/mayan-stack.yml mayan

x-mayan: &mayan
  image: ghcr.io/paul1578/mayan-edms-preprod:latest
  env_file: ../.env
  environment:
    MAYAN_SECRET_KEY: "${MAYAN_SECRET_KEY:?DEFINE MAYAN_SECRET_KEY en .env}"
    MAYAN_CELERY_BROKER_URL: redis://:${MAYAN_REDIS_PASSWORD:-mayanredispassword}@redis:6379/0
    MAYAN_CELERY_RESULT_BACKEND: redis://:${MAYAN_REDIS_PASSWORD:-mayanredispassword}@redis:6379/1
    MAYAN_LOCK_MANAGER_BACKEND: mayan.apps.lock_manager.backends.redis_lock.RedisLock
    MAYAN_LOCK_MANAGER_BACKEND_ARGUMENTS: "{'redis_url':'redis://:${MAYAN_REDIS_PASSWORD:-mayanredispassword}@redis:6379/2'}"
    MAYAN_DATABASES: "{'default':{'ENGINE':'django.db.backends.postgresql','NAME':'${MAYAN_DATABASE_NAME:-mayan}','PASSWORD':'${MAYAN_DATABASE_PASSWORD:-mayandbpass}','USER':'${MAYAN_DATABASE_USER:-mayan}','HOST':'${MAYAN_DATABASE_HOST:-postgresql}'}}"
    MAYAN_DEFAULT_FROM_EMAIL: ${MAYAN_DEFAULT_FROM_EMAIL:-mayan@localhost}
    MAYAN_EMAIL_BACKEND: ${MAYAN_EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
    MAYAN_EMAIL_HOST: ${MAYAN_EMAIL_HOST:-mailpit}
    MAYAN_EMAIL_HOST_PASSWORD: ${MAYAN_EMAIL_HOST_PASSWORD:-}
    MAYAN_EMAIL_HOST_USER: ${MAYAN_EMAIL_HOST_USER:-}
    MAYAN_EMAIL_PORT: ${MAYAN_EMAIL_PORT:-1025}
    MAYAN_EMAIL_USE_TLS: ${MAYAN_EMAIL_USE_TLS:-false}
    MAYAN_LANGUAGE_CODE: ${MAYAN_LANGUAGE_CODE:-es}
    MAYAN_TIME_ZONE: ${MAYAN_TIME_ZONE:-America/Guayaquil}
    MAYAN_DOCKER_WAIT: ${MAYAN_DOCKER_WAIT:-postgresql:5432 redis:6379 mailpit:1025}
    MAYAN_APT_INSTALLS: ${MAYAN_APT_INSTALLS:-tesseract-ocr-spa}
    MAYAN_OCR_LANGUAGE: ${MAYAN_OCR_LANGUAGE:-spa}
  healthcheck:
    test: ["CMD-SHELL", "/opt/mayan-edms/bin/python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=5)\""]
    interval: 30s
    timeout: 10s
    retries: 5
    start_period: 120s
  networks:
    - mayan-net
  volumes:
    - app_data:/var/lib/mayan
    - /mnt/escaner:/var/lib/mayan/watch_folder

services:
  app:
    <<: *mayan
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - mayan-net
      - traefik-public
    deploy:
      replicas: 1
      labels:
        traefik.enable: "true"
        traefik.docker.network: "traefik-public"
        traefik.http.routers.mayan-http.rule: "Host(`${MAYAN_DOMAIN}`)"
        traefik.http.routers.mayan-http.entrypoints: "http"
        traefik.http.routers.mayan-http.middlewares: "mayan-redirect"
        traefik.http.routers.mayan-http.service: "mayan"
        traefik.http.middlewares.mayan-redirect.redirectscheme.scheme: "https"
        traefik.http.middlewares.mayan-redirect.redirectscheme.permanent: "true"
        traefik.http.routers.mayan.rule: "Host(`${MAYAN_DOMAIN}`)"
        traefik.http.routers.mayan.entrypoints: "https"
        traefik.http.routers.mayan.tls: "true"
        traefik.http.routers.mayan.tls.certresolver: "http"
        traefik.http.routers.mayan.service: "mayan"
        traefik.http.services.mayan.loadbalancer.server.port: "80"
    ports:
      - "1987:80"

  postgresql:
    image: postgres:16
    environment:
      POSTGRES_DB: ${MAYAN_DATABASE_NAME:-mayan}
      POSTGRES_PASSWORD: ${MAYAN_DATABASE_PASSWORD:-mayandbpass}
      POSTGRES_USER: ${MAYAN_DATABASE_USER:-mayan}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mayan-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "no"
      - --databases
      - "3"
      - --maxmemory
      - "100mb"
      - --maxclients
      - "500"
      - --maxmemory-policy
      - "allkeys-lru"
      - --save
      - ""
      - --requirepass
      - "${MAYAN_REDIS_PASSWORD:-mayanredispassword}"
    volumes:
      - redis_data:/data
    networks:
      - mayan-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  mailpit:
    image: axllent/mailpit:latest
    networks:
      - mayan-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    ports:
      - "8025:8025"

  seed:
    <<: *mayan
    entrypoint: ["/bin/bash", "/scripts/seed_entrypoint.sh"]
    volumes:
      - app_data:/var/lib/mayan
      - ../scripts/seed_taxonomy.py:/scripts/seed_taxonomy.py:ro
      - ../scripts/seed_entrypoint.sh:/scripts/seed_entrypoint.sh:ro
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 15s
        max_attempts: 30

networks:
  traefik-public:
    external: true
  mayan-net:
    driver: overlay

volumes:
  app_data:
  postgres_data:
  redis_data: